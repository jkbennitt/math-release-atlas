# GitHub-hosted runners only. Do not switch this public repository to a self-hosted runner.
name: Upstream sync

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.sync.outputs.code }}
      old: ${{ steps.sync.outputs.old }}
      new: ${{ steps.sync.outputs.new }}
      guard: ${{ steps.verify.outputs.guard }}
      build: ${{ steps.verify.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - id: sync
        run: |
          set +e
          python3 scripts/sync.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e
          case "$code" in
            0|2|3) ;;
            *) exit "$code" ;;
          esac
      - name: Build and guard
        id: verify
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          set +e
          python3 scripts/check.py --self-test --source > /tmp/guard.log 2>&1
          guard=$?
          npm ci > /tmp/build.log 2>&1
          install=$?
          if [ "$install" -eq 0 ]; then
            npm run build >> /tmp/build.log 2>&1
            build=$?
          else
            build=$install
          fi
          set -e
          {
            echo ""
            echo "## Verification"
            echo ""
            echo "Pull requests opened by this workflow do not start the Build or Guard workflows, so the read-only job ran both before the pull request was opened."
            echo ""
            if [ "$guard" -eq 0 ]; then
              echo "- Guard: passed (\`python3 scripts/check.py --self-test --source\`)."
            else
              echo "- Guard: failed (\`python3 scripts/check.py --self-test --source\`)."
            fi
            if [ "$build" -eq 0 ]; then
              echo "- Build: passed (\`npm ci\` and \`npm run build\`, including the dist check)."
            else
              echo "- Build: failed (\`npm ci\` and \`npm run build\`, including the dist check)."
            fi
          } >> .sync-pr-body.md
          if [ "$guard" -ne 0 ]; then
            {
              echo ""
              echo "Guard output:"
              echo '```'
              tail -n 40 /tmp/guard.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          if [ "$build" -ne 0 ]; then
            {
              echo ""
              echo "Build output:"
              echo '```'
              tail -n 40 /tmp/build.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Pack sync payload
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          mkdir -p "${RUNNER_TEMP}/sync-payload"
          cp data/upstream.json "${RUNNER_TEMP}/sync-payload/upstream.json"
          cp data/families.json "${RUNNER_TEMP}/sync-payload/families.json"
          cp .sync-pr-body.md "${RUNNER_TEMP}/sync-payload/pr-body.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        with:
          name: sync-payload
          path: ${{ runner.temp }}/sync-payload
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.code == '2' || needs.prepare.outputs.code == '3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sync-payload
          path: sync-payload
      - name: Commit regenerated data
        id: commit
        env:
          OLD: ${{ needs.prepare.outputs.old }}
          NEW: ${{ needs.prepare.outputs.new }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short="${NEW:0:12}"
          branch="upstream-sync-${short}"
          git checkout -B "$branch"
          cp sync-payload/upstream.json data/upstream.json
          cp sync-payload/families.json data/families.json
          git add data/upstream.json data/families.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data change to commit."
          else
            git commit -m "upstream sync ${OLD:0:12} to ${short}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Push branch
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          spec="$(git ls-remote "$remote" "refs/heads/${BRANCH}")"
          if [ -n "$spec" ]; then
            sha="${spec%%$'\t'*}"
            git push --force-with-lease="refs/heads/${BRANCH}:${sha}" "$remote" "HEAD:refs/heads/${BRANCH}"
          else
            git push "$remote" "HEAD:refs/heads/${BRANCH}"
          fi
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ needs.prepare.outputs.old }}
          NEW: ${{ needs.prepare.outputs.new }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          short="${NEW:0:12}"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file sync-payload/pr-body.md
          elif [ "$COMMITTED" = "true" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "upstream sync ${OLD:0:12}→${short}" --body-file sync-payload/pr-body.md
          else
            echo "No commit and no open pull request."
          fi
      - name: Fail on count drift or a failed check
        if: success()
        env:
          CODE: ${{ needs.prepare.outputs.code }}
          GUARD: ${{ needs.prepare.outputs.guard }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          if [ "$CODE" != "2" ] || [ "$GUARD" != "0" ] || [ "$BUILD" != "0" ]; then
            exit 1
          fi
