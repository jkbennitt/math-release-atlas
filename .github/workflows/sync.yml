# GitHub-hosted runners only. Do not switch this public repository to a self-hosted runner.
name: Upstream sync

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - id: sync
        run: |
          set +e
          python3 scripts/sync.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e
          case "$code" in
            0|2|3) ;;
            *) exit "$code" ;;
          esac
      - name: Build and guard
        id: verify
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          set +e
          python3 scripts/check.py --self-test --source > /tmp/guard.log 2>&1
          guard=$?
          npm ci > /tmp/build.log 2>&1
          install=$?
          if [ "$install" -eq 0 ]; then
            npm run build >> /tmp/build.log 2>&1
            build=$?
          else
            build=$install
          fi
          set -e
          {
            echo ""
            echo "## Verification"
            echo ""
            echo "Pull requests opened by this workflow do not start the Build or Guard workflows, so this job ran both before opening the pull request."
            echo ""
            if [ "$guard" -eq 0 ]; then
              echo "- Guard: passed (\`python3 scripts/check.py --self-test --source\`)."
            else
              echo "- Guard: failed (\`python3 scripts/check.py --self-test --source\`)."
            fi
            if [ "$build" -eq 0 ]; then
              echo "- Build: passed (\`npm ci\` and \`npm run build\`, including the dist check)."
            else
              echo "- Build: failed (\`npm ci\` and \`npm run build\`, including the dist check)."
            fi
          } >> .sync-pr-body.md
          if [ "$guard" -ne 0 ]; then
            {
              echo ""
              echo "Guard output:"
              echo '```'
              tail -n 40 /tmp/guard.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          if [ "$build" -ne 0 ]; then
            {
              echo ""
              echo "Build output:"
              echo '```'
              tail -n 40 /tmp/build.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.sync.outputs.old }}
          NEW: ${{ steps.sync.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short="${NEW:0:12}"
          branch="upstream-sync-${short}"
          git checkout -B "$branch"
          git add data/upstream.json data/families.json
          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi
          git commit -m "upstream sync ${OLD:0:12} to ${short}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push --force-with-lease -u origin "$branch"
          else
            git push -u origin "$branch"
          fi
          if ! gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qx '1'; then
            gh pr create --base main --head "$branch" --title "upstream sync ${OLD:0:12}→${short}" --body-file .sync-pr-body.md
          fi
      - name: Fail on count drift or a failed check
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          if [ "${{ steps.sync.outputs.code }}" != "2" ] || [ "${{ steps.verify.outputs.guard }}" != "0" ] || [ "${{ steps.verify.outputs.build }}" != "0" ]; then
            exit 1
          fi
