# GitHub-hosted runners only. Do not switch this public repository to a self-hosted runner.
name: Upstream sync

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.sync.outputs.code }}
      old: ${{ steps.sync.outputs.old }}
      new: ${{ steps.sync.outputs.new }}
      apn_old: ${{ steps.sync.outputs.apn_old }}
      apn_new: ${{ steps.sync.outputs.apn_new }}
      fm_old: ${{ steps.sync.outputs.fm_old }}
      fm_new: ${{ steps.sync.outputs.fm_new }}
      flt_old: ${{ steps.sync.outputs.flt_old }}
      flt_new: ${{ steps.sync.outputs.flt_new }}
      guard: ${{ steps.verify.outputs.guard }}
      build: ${{ steps.verify.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - id: sync
        run: |
          set +e
          python3 scripts/sync.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e
          # Exit 0 means the recorded commit is unchanged. The publish job does not run, so no pull request is opened.
          case "$code" in
            0|2|3) ;;
            *) exit "$code" ;;
          esac
      - name: Build and guard
        id: verify
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          set +e
          python3 scripts/check.py --self-test --source --verify-upstream > /tmp/guard.log 2>&1
          guard=$?
          npm ci > /tmp/build.log 2>&1
          install=$?
          if [ "$install" -eq 0 ]; then
            npm run build >> /tmp/build.log 2>&1
            build=$?
          else
            build=$install
          fi
          set -e
          {
            echo ""
            echo "## Verification"
            echo ""
            echo "A pull request opened with the default token leaves Build and Guard waiting for approval, so they do not run. After the push, the publish job starts both with workflow_dispatch. The read-only job also ran them before the pull request was opened."
            echo ""
            if [ "$guard" -eq 0 ]; then
              echo "- Guard: passed (\`python3 scripts/check.py --self-test --source --verify-upstream\`)."
            else
              echo "- Guard: failed (\`python3 scripts/check.py --self-test --source --verify-upstream\`)."
            fi
            if [ "$build" -eq 0 ]; then
              echo "- Build: passed (\`npm ci\` and \`npm run build\`, including the dist check)."
            else
              echo "- Build: failed (\`npm ci\` and \`npm run build\`, including the dist check)."
            fi
          } >> .sync-pr-body.md
          if [ "$guard" -ne 0 ]; then
            {
              echo ""
              echo "Guard output:"
              echo '```'
              tail -n 40 /tmp/guard.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          if [ "$build" -ne 0 ]; then
            {
              echo ""
              echo "Build output:"
              echo '```'
              tail -n 40 /tmp/build.log
              echo '```'
            } >> .sync-pr-body.md
          fi
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Pack sync payload
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        run: |
          mkdir -p "${RUNNER_TEMP}/sync-payload"
          cp data/upstream.json "${RUNNER_TEMP}/sync-payload/upstream.json"
          cp data/families.json "${RUNNER_TEMP}/sync-payload/families.json"
          cp data/alphaproof.json "${RUNNER_TEMP}/sync-payload/alphaproof.json"
          cp data/anthropic.json "${RUNNER_TEMP}/sync-payload/anthropic.json"
          cp data/sources.json "${RUNNER_TEMP}/sync-payload/sources.json"
          cp .sync-pr-body.md "${RUNNER_TEMP}/sync-payload/pr-body.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.sync.outputs.code == '2' || steps.sync.outputs.code == '3'
        with:
          name: sync-payload
          path: ${{ runner.temp }}/sync-payload
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.code == '2' || needs.prepare.outputs.code == '3')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sync-payload
          path: sync-payload
      - name: Commit regenerated data
        id: commit
        env:
          OLD: ${{ needs.prepare.outputs.old }}
          NEW: ${{ needs.prepare.outputs.new }}
          APN_OLD: ${{ needs.prepare.outputs.apn_old }}
          APN_NEW: ${{ needs.prepare.outputs.apn_new }}
          FM_OLD: ${{ needs.prepare.outputs.fm_old }}
          FM_NEW: ${{ needs.prepare.outputs.fm_new }}
          FLT_OLD: ${{ needs.prepare.outputs.flt_old }}
          FLT_NEW: ${{ needs.prepare.outputs.flt_new }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One Actions pull request on this repository, chosen by number. A fork cannot name the branch.
          selected="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,isCrossRepository,author,headRefName | env -u GH_TOKEN -u GITHUB_TOKEN jq -e -f scripts/sync_pr_select.jq)"
          count="$(jq 'length' <<<"$selected")"
          number=""
          if [ "$count" -eq 1 ]; then
            number="$(jq -r '.[0].number' <<<"$selected")"
            candidate="$(jq -r '.[0].headRefName' <<<"$selected")"
            case "$candidate" in
              upstream-sync|upstream-sync-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
                branch="$candidate"
                ;;
              *)
                echo "Refusing an unexpected sync branch name." >&2
                exit 1
                ;;
            esac
          elif [ "$count" -eq 0 ]; then
            branch="upstream-sync"
          else
            echo "More than one sync pull request." >&2
            exit 1
          fi
          unset GITHUB_TOKEN GH_TOKEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          cp sync-payload/upstream.json data/upstream.json
          cp sync-payload/families.json data/families.json
          cp sync-payload/alphaproof.json data/alphaproof.json
          cp sync-payload/anthropic.json data/anthropic.json
          cp sync-payload/sources.json data/sources.json
          git add data/upstream.json data/families.json data/alphaproof.json data/anthropic.json data/sources.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data change to commit."
          else
            git commit -m "upstream sync openai ${OLD:0:12} to ${NEW:0:12}, alphaproof ${APN_OLD:0:12} to ${APN_NEW:0:12}, anthropic ${FM_OLD:0:12} to ${FM_NEW:0:12}, flt ${FLT_OLD:0:12} to ${FLT_NEW:0:12}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Push branch
        id: push
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          NUMBER: ${{ steps.commit.outputs.number }}
          NEW: ${{ needs.prepare.outputs.new }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          branch="$BRANCH"
          number="$NUMBER"
          spec="$(git ls-remote "$remote" "refs/heads/${branch}")"
          if [ -n "$spec" ]; then
            # A new generated_at must not replace a human commit on this branch.
            # Fetch full main so commits already on main are not unique to this branch.
            git fetch --no-tags "$remote" "+refs/heads/main:refs/remotes/origin/main" "refs/heads/${branch}:refs/heads/sync-existing"
            plan="$(env -u GH_TOKEN -u GITHUB_TOKEN bash scripts/sync_push_plan.sh "$branch" "$number" "$NEW")"
            mode="$(printf '%s\n' "$plan" | sed -n 's/^mode=//p')"
            if [ "$mode" = fresh ]; then
              echo "Leaving ${branch} in place because it has a human commit." >&2
              fresh="upstream-sync-${NEW:0:12}"
              if [ "$fresh" != "$(printf '%s\n' "$plan" | sed -n 's/^branch=//p')" ]; then
                echo "Refusing an unexpected fresh branch name." >&2
                exit 1
              fi
              if git ls-remote "$remote" "refs/heads/${fresh}" | grep -q .; then
                echo "Refusing to overwrite existing ${fresh}." >&2
                exit 1
              fi
              git checkout -B "$fresh"
              git push "$remote" "HEAD:refs/heads/${fresh}"
              branch="$fresh"
              number=""
            elif [ "$mode" = reuse ]; then
              sha="${spec%%$'\t'*}"
              git push --force-with-lease="refs/heads/${branch}:${sha}" "$remote" "HEAD:refs/heads/${branch}"
            else
              echo "Sync branch plan failed." >&2
              exit 1
            fi
          else
            git push "$remote" "HEAD:refs/heads/${branch}"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ needs.prepare.outputs.old }}
          NEW: ${{ needs.prepare.outputs.new }}
          APN_OLD: ${{ needs.prepare.outputs.apn_old }}
          APN_NEW: ${{ needs.prepare.outputs.apn_new }}
          FM_OLD: ${{ needs.prepare.outputs.fm_old }}
          FM_NEW: ${{ needs.prepare.outputs.fm_new }}
          FLT_OLD: ${{ needs.prepare.outputs.flt_old }}
          FLT_NEW: ${{ needs.prepare.outputs.flt_new }}
          PUSH_BRANCH: ${{ steps.push.outputs.branch }}
          PUSH_NUMBER: ${{ steps.push.outputs.number }}
          COMMIT_BRANCH: ${{ steps.commit.outputs.branch }}
          COMMIT_NUMBER: ${{ steps.commit.outputs.number }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          # Edit the selected pull request by number. This job never merges it.
          short="${NEW:0:12}"
          title="upstream sync openai ${OLD:0:12}→${short}; alphaproof ${APN_OLD:0:12}→${APN_NEW:0:12}; anthropic ${FM_OLD:0:12}→${FM_NEW:0:12}; flt ${FLT_OLD:0:12}→${FLT_NEW:0:12}"
          if [ "$COMMITTED" = "true" ]; then
            branch="$PUSH_BRANCH"
            number="$PUSH_NUMBER"
          else
            branch="$COMMIT_BRANCH"
            number="$COMMIT_NUMBER"
          fi
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file sync-payload/pr-body.md
          elif [ "$COMMITTED" = "true" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file sync-payload/pr-body.md
          else
            echo "No commit and no open pull request."
          fi
      - name: Start Build and Guard
        if: success() && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          # pull_request runs from this token stay at action_required and never execute.
          # workflow_dispatch always creates a run, and the checks attach to this branch.
          if [ -z "$BRANCH" ]; then
            echo "Sync push did not report a branch." >&2
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run guard.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Fail on count drift or a failed check
        if: success()
        env:
          CODE: ${{ needs.prepare.outputs.code }}
          GUARD: ${{ needs.prepare.outputs.guard }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          if [ "$CODE" != "2" ] || [ "$GUARD" != "0" ] || [ "$BUILD" != "0" ]; then
            exit 1
          fi
